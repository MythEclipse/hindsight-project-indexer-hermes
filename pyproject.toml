[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-project-indexer-hermes"
version = "0.1.0"
description = "Smart project indexing & context injector for Hermes Agent using Hindsight memory backend"
readme = "README.md"
authors = [
  { name = "MythEclipse" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "hindsight-client>=0.1.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0"
]
